name: routezy_mobile
description: "A lightweight GPS tracker for monitoring routes, distance, and movement activities."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.9


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  permission_handler: ^12.0.1
  geolocator: ^14.0.2
  location: ^8.0.1
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  get_it: ^9.2.1
  equatable: ^2.0.8
  intl: ^0.20.2
  flutter_bloc: ^9.1.1
  bloc: ^9.2.0
  flutter_background_service: ^5.1.0
  lottie: ^3.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.12.2
  hive_ce_generator: ^1.11.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/lottie/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/poppins/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/poppins/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/poppins/Poppins-Light.ttf
          weight: 300

